name: build and test ikomida shared backend lib before pull request merge
on:
  pull_request:
    branches:
      - dev
      - hmlg
      - main

env:
  GCLOUD_LOCATION: us-central1

jobs:
  build_ikomida:
    runs-on:
      - self-hosted
      - ubuntu
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ endsWith(github.base_ref, 'main') && secrets.ARTIFACT_REGISTRY_IKOMIDA_PROD_SERVICE_ACOUNT || (endsWith(github.base_ref, 'hmlg') && secrets.ARTIFACT_REGISTRY_IKOMIDA_HMLG_SERVICE_ACOUNT || secrets.ARTIFACT_REGISTRY_IKOMIDA_DEV_SERVICE_ACOUNT) }}"
      - name: Auth npm with artifactregistry and set gcloud project id
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |-
          echo "Selected gcloud project id: ${PROJECT_ID}"
          rm .npmrc || true
          echo "@ikomida:registry=https://${GCLOUD_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/" >> .npmrc
          echo "//${GCLOUD_LOCATION}-npm.pkg.dev/${PROJECT_ID}/node/:always-auth=true" >> .npmrc
          yarn glogin
      - name: Check lib version
        run: |
          LIB_NAME=$(node --eval="process.stdout.write(require('./package.json').name)")
          LIB_VERSION=$(node --eval="process.stdout.write(require('./package.json').version)")
          LIB_VERSION_REMOTE=$(npm view "${LIB_NAME}" version)
          if { echo "$LIB_VERSION"; echo "$LIB_VERSION_REMOTE"; } | sort --version-sort --check; then
              echo "Error: you mast update lib package version"
              exit 1
          else
              echo "Lib package version is correct"
              exit 0
          fi
      - name: Get yarn cache directory path
        if: github.base_ref == 'dev'
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        if: github.base_ref == 'dev'
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: |-
          rm yarn.lock || true
          yarn install
      - name: Prepare code
        run: |
          yarn format
          yarn lint
      - name: Build code
        run: yarn build

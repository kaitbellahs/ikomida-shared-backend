name: publish ikomida prod lib to artifact registry on pull request merge
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main
jobs:
  build_and_deploy_ikomida:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0"
        with:
          credentials_json: "${{ secrets.ARTIFACT_REGISTRY_IKOMIDA_PROD_SERVICE_ACOUNT }}"
      - id: publish
        run: |
          gcloud auth activate-service-account artifact-registry@ikomida-prod.iam.gserviceaccount.com --key-file=$GOOGLE_APPLICATION_CREDENTIALS
          rm .npmrc || true
          echo "@ikomida:registry=https://us-central1-npm.pkg.dev/ikomida-prod/node/" >> .npmrc && echo "//us-central1-npm.pkg.dev/ikomida-prod/node/:always-auth=true" >> .npmrc
          npx google-artifactregistry-auth
          yarn install
          npm publish
